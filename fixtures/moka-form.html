<!doctype html>
<meta charset="utf-8">
<title>AutoApply Moka-shaped form fixture</title>

<div class="apply-field-fixture string_info-fixture">
  <div class="title-fixture"><span><span>姓名</span></span><span class="required-asterisk-fixture"></span></div>
  <div class="ctrl-fixture">
    <label class="sd-Input-container-fixture string_info">
      <input id="moka-name" autocomplete="new_password" placeholder="姓名">
    </label>
  </div>
</div>

<div class="apply-field-fixture day_info-fixture">
  <div class="title-fixture"><span><span>出生日期 (年龄)</span></span></div>
  <div class="ctrl-fixture">
    <div class="sd-Dropdown-container-fixture">
      <label class="sd-Input-container-fixture day_info">
        <input id="moka-birth-date" readonly placeholder="出生日期 (年龄)">
        <span class="sd-picker-addon-fixture"></span>
      </label>
    </div>
  </div>
</div>

<div class="apply-field-fixture Select-fixture">
  <div class="title-fixture"><span><span>性别</span></span></div>
  <div class="ctrl-fixture">
    <div class="sd-Dropdown-container-fixture">
      <label class="sd-Input-container-fixture sd-Select-container-fixture select">
        <input id="moka-gender" autocomplete="nope" placeholder="请选择">
      </label>
    </div>
  </div>
</div>
