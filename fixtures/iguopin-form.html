<!doctype html>
<meta charset="utf-8">
<title>AutoApply IGuopin-shaped form fixture</title>
<style>
  .fixed-control { position: fixed; width: 320px; height: 32px; }
  .ant-select-selection-search-input { opacity: 0; }
  .ant-radio-button-input { width: 0; height: 0; }
  .ant-form-item-hidden, [hidden] { display: none; }
</style>

<input placeholder="请输入职位或企业名称">
<form class="ant-form ant-form-vertical">
  <div class="ant-form-item">
    <div class="ant-form-item-label"><label for="full_name">姓名</label></div>
    <div class="ant-form-item-control"><input id="full_name" class="ant-input fixed-control" placeholder="请填写真实姓名"></div>
  </div>

  <div class="ant-form-item">
    <div class="ant-form-item-label"><label for="birthdate">出生日期</label></div>
    <div class="ant-form-item-control"><div class="ant-picker"><input id="birthdate" class="fixed-control" readonly placeholder="请选择出生日期"></div></div>
  </div>

  <div class="ant-form-item">
    <div class="ant-form-item-label"><label>性别</label></div>
    <div class="ant-form-item-control ant-radio-group">
      <label class="ant-radio-button-wrapper"><span><input class="ant-radio-button-input" type="radio" value="114XDxDX"></span>男</label>
      <label class="ant-radio-button-wrapper"><span><input class="ant-radio-button-input" type="radio" value="116ufbe1"></span>女</label>
    </div>
  </div>

  <div class="ant-form-item resume-common-form-item cascader-modal-field cascader-modal-location">
    <div class="ant-form-item-label"><label>现居住地</label></div>
    <div class="ant-form-item-control"><div><div><div><div>
      <div class="ant-form-item"><div class="ant-form-item-control"><div class="ant-select ant-cascader"><div class="ant-select-selector">
        <input id="location-fe-1601-customization" class="ant-select-selection-search-input fixed-control" role="combobox" readonly>
        <span>请选择现居住地</span>
      </div></div></div></div>
    </div></div></div></div></div>
    <input hidden class="ant-input" value="">
  </div>

  <div class="ant-form-item resume-common-form-item cascader-modal-field cascader-modal-hukou">
    <div class="ant-form-item-label"><label>户口所在地</label></div>
    <div class="ant-form-item-control"><div class="ant-select ant-cascader"><div class="ant-select-selector">
      <input id="hukou-fe-1601-customization" class="ant-select-selection-search-input fixed-control" role="combobox" readonly>
      <span class="ant-select-selection-placeholder">请选择户口所在地</span>
    </div></div></div>
  </div>

  <div class="ant-form-item resume-common-form-item form-item-autocomplete-field autocomplete-highest_school auto-complete-field">
    <div class="ant-form-item-label"><label>毕业院校</label></div>
    <div class="ant-form-item-control"><div><div><div><div>
      <div class="ant-form-item"><div class="ant-form-item-control"><div class="ant-select ant-select-show-search"><div class="ant-select-selector">
        <input id="highest_school-fe-1601-customization" class="ant-select-selection-search-input fixed-control" role="combobox">
        <span>请填写毕业院校</span>
      </div></div></div></div>
    </div></div></div></div></div>
    <div class="ant-form-item ant-form-item-hidden"><input id="highest_school" class="ant-input"></div>
  </div>
</form>
<script>
// Readonly date selection must commit through a calendar, not input.value.
const birth = document.querySelector('#birthdate');
let year = 2026, decade = 2020, month = '09';
let popup;
function renderCalendar(mode) {
  popup.innerHTML = '';
  const panel = document.createElement('div');
  panel.className = `ant-picker-${mode}-panel`;
  popup.append(panel);
  function button(cls, text, action) {
    const b = document.createElement('button'); b.type = 'button'; b.className = cls; b.textContent = text; b.onclick = action; panel.append(b);
  }
  function cell(title, action) {
    const c = document.createElement('div'); c.className = 'ant-picker-cell'; c.title = title; c.textContent = title; c.onclick = action; panel.append(c);
  }
  if (mode === 'year') {
    button('ant-picker-header-super-prev-btn', 'previous decade', () => { decade -= 10; renderCalendar('year'); });
    button('ant-picker-header-super-next-btn', 'next decade', () => { decade += 10; renderCalendar('year'); });
    for (let y = decade; y < decade + 10; y++) cell(String(y), () => { year = y; renderCalendar('date'); });
  } else if (mode === 'month') {
    for (let m = 1; m <= 12; m++) cell(`${year}-${String(m).padStart(2, '0')}`, () => { month = String(m).padStart(2, '0'); renderCalendar('date'); });
  } else {
    button('ant-picker-year-btn', String(year), () => renderCalendar('year'));
    button('ant-picker-month-btn', month, () => renderCalendar('month'));
    for (let d = 1; d <= 28; d++) {
      const value = `${year}-${month}-${String(d).padStart(2, '0')}`;
      cell(value, () => { birth.value = value; birth.dataset.committed = value; popup.remove(); });
    }
  }
}
birth.onclick = () => {
  popup?.remove(); popup = document.createElement('div'); popup.className = 'ant-picker-dropdown'; document.body.append(popup); renderCalendar('date');
};


// Keep an old visible address modal to reproduce Guopin retaining overlays.
function addressModal(field, zIndex) {
  const wrap = document.createElement('div');
  wrap.className = 'ant-modal-wrap'; wrap.style.cssText = `position:fixed;inset:0;z-index:${zIndex};background:#fff`;
  let selected = [];
  const levels = [
    field === 'hukou' ? ['江西', '北京'] : ['河北', '北京'],
    field === 'hukou' ? ['南昌'] : ['秦皇岛'],
    field === 'hukou' ? ['进贤县'] : ['海港区'],
  ];
  const render = () => {
    wrap.innerHTML = '<button class="ant-modal-close" type="button">关闭</button><div class="address-options"></div>';
    wrap.querySelector('.ant-modal-close').onclick = () => wrap.remove();
    const options = wrap.querySelector('.address-options');
    for (const text of levels[selected.length] || []) {
      const item = document.createElement('button'); item.type = 'button'; item.className = 'level-item'; item.textContent = text;
      item.onclick = () => {
        selected.push(text);
        if (selected.length === 3) {
          const control = document.querySelector(`#${field}-fe-1601-customization`).closest('.ant-select');
          control.querySelector('.ant-select-selection-placeholder')?.remove();
          let value = control.querySelector('.ant-select-selection-item');
          if (!value) { value = document.createElement('span'); value.className = 'ant-select-selection-item'; control.append(value); }
          value.textContent = `中国 / ${selected.join(' / ')}`;
          wrap.remove();
        } else render();
      };
      options.append(item);
    }
  };
  render(); document.body.append(wrap); return wrap;
}
const stale = addressModal('location', 900);
stale.querySelector('.ant-modal-close').remove();
document.querySelector('#location-fe-1601-customization').closest('.ant-select-selector').onclick = () => addressModal('location', 1100);
document.querySelector('#hukou-fe-1601-customization').closest('.ant-select-selector').onclick = () => addressModal('hukou', 1200);
</script>
